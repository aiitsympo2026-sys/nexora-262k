<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

</head>

<body>


    <div class="login-box">


        <h1>
            🚀 ADMIN LOGIN
        </h1>


        <p>
            Symposium Admin Dashboard
        </p>


        <input
            type="text"
            id="username"
            placeholder="Enter Username"
        >


        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >


        <p
            id="errorMessage"
            class="error-message"
        >
        </p>


        <button
            id="loginBtn"
        >

            LOGIN

        </button>


    </div>


    <script
        src="admin-login.js"
    ></script>


</body>

</html>
